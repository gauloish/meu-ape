[project]
name = "ingestion"
version = "0.1.0"
description = "Coleta diária de anúncios do Zap Imóveis e sincronização com PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "tqdm>=4.70.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
src = ["."]

[tool.pyright]
extraPaths = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
