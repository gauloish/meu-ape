version: '3'

dotenv:
  - ".env"

tasks:
  default:
    desc: "Lista todos os comandos disponíveis"
    cmds:
      - task --list

  daily:
    desc: "Executa a coleta diária incremental com deduplicação e gravação no banco"
    cmds:
      - uv run python main.py daily-scrape --concurrency ${CONCURRENCY:-1} --max-pages ${MAX_PAGES:-10}

  daily-dry:
    desc: "Executa a coleta diária sem gravar no banco (dry-run)"
    cmds:
      - uv run python main.py daily-scrape --concurrency ${CONCURRENCY:-1} --max-pages ${MAX_PAGES:-10} --dry-run

  scrape:
    desc: "Executa a coleta completa assíncrona de todas as partições"
    cmds:
      - uv run python main.py scrape-async --concurrency ${CONCURRENCY:-1}

  deduplicate:
    desc: "Remove anúncios duplicados do mesmo imóvel físico no dataset bruto"
    cmds:
      - uv run python main.py deduplicate

  load-csv:
    desc: "Carrega em lote um CSV existente no banco de dados"
    cmds:
      - uv run python main.py load-csv --input ${INPUT:-data/processed/zap_dataset_deduplicated.csv}

  validate:
    desc: "Compara a cobertura do dataset local com os totais oficiais do portal"
    cmds:
      - uv run python main.py validate

  lint:
    desc: "Executa verificação de código com o Ruff via uv"
    cmds:
      - uv run ruff check .

  format:
    desc: "Executa formatação de código com o Ruff via uv"
    cmds:
      - uv run ruff format --check .

  verify:
    desc: "Executa verificação estática de código com o ty via uv"
    cmds:
      - uv run ty check .

  test:
    desc: "Executa a suíte de testes unitários com pytest via uv"
    cmds:
      - uv run pytest -v

  test-cov:
    desc: "Executa a suíte de testes com medição de cobertura de código via uv"
    cmds:
      - uv run --with pytest-cov pytest --cov=src tests
