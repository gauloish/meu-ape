version: '3'

dotenv:
  - ".env"

tasks:
  default:
    desc: "Lista todos os comandos disponíveis"
    cmds:
      - task --list

  up:
    desc: "Sobe toda a infraestrutura Docker em background"
    cmds:
      - docker compose up -d

  build:
    desc: "Reconstrói a imagem Docker do worker e sobe os contêineres"
    cmds:
      - docker compose up --build -d

  down:
    desc: "Derruba e remove os contêineres e redes do Docker"
    cmds:
      - docker compose down

  clean:
    desc: "Derruba a stack, apaga os volumes de dados (banco/nominatim) e imagens locais"
    cmds:
      - docker compose down -v --rmi local --remove-orphans

  reset:
    desc: "Limpa totalmente os dados/imagens (clean) e recria o ambiente do zero"
    cmds:
      - task: clean
      - task: run

  logs:
    desc: "Mostra os logs do worker em tempo real"
    cmds:
      - docker compose logs -f ml_worker

  ps:
    desc: "Exibe o status do contêiner Docker"
    cmds:
      - docker compose ps

  shell:
    desc: "Abre um terminal interativo bash no contêiner da API"
    cmds:
      - docker compose exec ml_worker bash

  lint:
    desc: "Executa verificação de código com o Ruff via uv"
    cmds:
      - uv run ruff check .

  format:
    desc: "Executa formatação de código com o Ruff via uv"
    cmds:
      - uv run ruff format --check .

  verify:
    desc: "Executa verificação estática de código com o ty via uv"
    cmds:
      - uv run ty check .

  test:
    desc: "Executa a suíte de testes unitários com pytest via uv"
    cmds:
      - uv run pytest -v

  test-cov:
    desc: "Executa a suíte de testes com medição de cobertura de código via uv"
    cmds:
      - uv run --with pytest-cov pytest --cov=src tests

  run:
    desc: "Fluxo completo: Sobe a infraestrutura Docker"
    cmds:
      - task: build
  
  train:
    desc: "Executa o treinamento do modelo com otimização de hiperparâmetros e Nested CV"
    cmds:
      - uv run python main.py --mode train --dataset-source ${DATASET_SOURCE:-user/dataset_repo_name} --n-trials ${N_TRIALS:-20} --k-folds ${K_FOLDS:-5} --push-to-hub --repo-id ${REPO_ID:-user/model_repo_name}