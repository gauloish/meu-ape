services:
  # 1. Banco de Dados PostgreSQL para Cache
  cache_db:
    image: postgres:15-alpine
    container_name: geocoding_cache_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-geocoding_database}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - cache_data:/var/lib/postgresql/data
    networks:
      - geocoding_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-geocoding_database}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Servidor Nominatim (Geocodificação Offline)
  nominatim_server:
    image: mediagis/nominatim:5.3
    container_name: nominatim_server
    restart: unless-stopped
    ports:
      - "${NOMINATIM_HOST_PORT:-8080}:8080"
    environment:
      - PBF_PATH=/nominatim/data_pbf/goiania.osm.pbf
    volumes:
      - ./artifacts/nominatim:/nominatim/data_pbf:z
      - nominatim_data:/var/lib/postgresql/16/main
    shm_size: 1g
    networks:
      - geocoding_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 3. API FastAPI
  web_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geocoding_fastapi
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      cache_db:
        condition: service_healthy
      nominatim_server:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_HOST=${POSTGRES_HOST:-cache_db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-geocoding_database}
      - NOMINATIM_URL=${NOMINATIM_URL:-http://nominatim_server:8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - geocoding_net

networks:
  geocoding_net:
    driver: bridge
    name: geocoding_network

volumes:
  cache_data:
  nominatim_data: