[project]
name = "geocoding-client"
version = "0.1.0"
description = "Cliente Python para consumo da API de Geocodificação com suporte a batch e exponential backoff"
readme = "README.md"
authors = [
    { name = "gauloish", email = "125079293+gauloish@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "logging-settings",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
logging-settings = { workspace = true }
