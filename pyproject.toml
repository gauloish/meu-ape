[project]
name = "meu-ape"
version = "0.1.0"
description = "Pipeline de dados imobiliários — Zap Imóveis → Goiânia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.0",
    "python-dotenv>=1.0.0",
    "fastparquet>=2026.5.0",
    "feature-engine>=1.9.4",
    "folium>=0.20.0",
    "geopy>=2.5.0",
    "googlemaps>=4.10.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "missingno>=0.5.2",
    "numpy>=2.5.1",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "scrapy>=2.17.0",
    "seaborn>=0.13.2",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
]

[project.scripts]
meu-ape = "src.cli.main:main"
