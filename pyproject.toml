[project]
name = "meu-ape"
version = "0.1.0"
description = "Pipeline de previsão de preço de imóveis — Zap Imóveis → Goiânia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.0",
    "python-dotenv>=1.0.0",
    "fastparquet>=2026.5.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "scrapy>=2.17.0",
]

[tool.uv.workspace]
members = [
    "apps/backend",
    "apps/ingestion",
    "apps/geocoding-api",
    "apps/ml-worker",
    "packages/geocoding-client",
    "packages/ml-core",
    "notebooks",
]
