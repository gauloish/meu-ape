name: Ingestion & Price Index Sync

on:
  # Agendamento automático desativado devido ao bloqueio WAF/HTTP 403 em IPs de datacenter
  # e às restrições dos Termos de Uso do portal contra coleta automatizada.
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução do pipeline"
        required: true
        default: "apply-index"
        type: choice
        options:
          - apply-index
          - daily-scrape

jobs:
  ingestion-sync:
    name: Ingestion & Price History Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen --package ingestion

      - name: Run Ingestion Pipeline
        working-directory: apps/ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.mode }}" = "apply-index" ]; then
            uv run --frozen --package ingestion python main.py apply-index
          else
            uv run --frozen --package ingestion python main.py daily-scrape --concurrency 1 --apply-fipezap
          fi
